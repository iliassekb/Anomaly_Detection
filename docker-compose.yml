services:

  # ── MinIO object storage ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: defectvision-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Create MinIO buckets on first start ─────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: defectvision-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/defectvision &&
        mc mb --ignore-existing local/defectvision-mlflow &&
        echo 'Buckets ready'
      "

  # ── MLflow tracking server ───────────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: defectvision-mlflow
    ports:
      - "5000:5000"   # UI → http://localhost:5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      minio:
        condition: service_healthy

  # ── FastAPI inference + dataset backend ─────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: defectvision-api
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: defectvision
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./weights:/app/weights   # model weights (persisted on host)
      - ./api:/app/api           # live-reload during development
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000 --reload

  # ── Next.js frontend ─────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: defectvision-web
    ports:
      - "3000:3000"   # UI → http://localhost:3000
    depends_on:
      - api

volumes:
  minio_data:
  mlflow_data:
